train:
  batchsize: 1
  save_every_n_epochs: 100
  metrics:
    train: ~
    train_and_validation:
      - "Loss"
      - "AllCosts"
    validation: ~
  tag: "experience_25tasks10scenarios"
  optimizer:
    name: "ADAM"
    args: ~
  nb_epochs: 200
  log_dir: "logs"
  log_every_n_epochs: 1
model:
  name: "PerturbedGLM"
  args:
    M: 20
    nb_features: 20
    ε: 50
    model_builder: "grb_model"
data:
  validation_file: "validation.jld2"
  data_dir: "/libre/batyl/data/StoVSP/25tasks10scenarios"
  train_file: "train.jld2"
